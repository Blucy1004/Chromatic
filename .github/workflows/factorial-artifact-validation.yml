name: Validate exact factorial Windows artifact
on:
  push:
    branches: [operation-overlord]
    paths: [.github/workflows/factorial-artifact-validation.yml]
  workflow_dispatch:
    inputs:
      research_run:
        description: Completed factorial run ID
        required: true
        default: '40152066905'
permissions:
  contents: write
  actions: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      SOURCE_RUN: ${{ inputs.research_run || '40152066905' }}
      PROTOCOL_OUT: project-chromatic-overlord/reports/factorial/artifact-validation/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-chess==1.999 chess==1.10.0 psutil==7.2.2
      - uses: actions/download-artifact@v4
        with:
          name: factorial-windows-${{ env.SOURCE_RUN }}-1
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: native-artifact
      - name: Verify exact executable and run native UCI checks
        shell: pwsh
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid run ID' }
          New-Item -ItemType Directory -Force $env:PROTOCOL_OUT | Out-Null
          $exe=(Get-ChildItem native-artifact -Recurse -Filter chromatic_overlord.exe | Select-Object -First 1).FullName
          $manifest=(Get-ChildItem native-artifact -Recurse -Filter manifest.json | Select-Object -First 1).FullName
          if (!$exe -or !$manifest) { throw 'Artifact missing binary or manifest' }
          $identity=Get-Content $manifest -Raw | ConvertFrom-Json
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $identity.engine_sha256) { throw 'Artifact binary digest mismatch' }
          @{research_run=$env:SOURCE_RUN;engine_sha256=$actual;native_os=[System.Environment]::OSVersion.VersionString;cpu=(Get-CimInstance Win32_Processor).Name;scope='same executable on a separate native Windows host; protocol only'} | ConvertTo-Json | Set-Content "$env:PROTOCOL_OUT/artifact.json" -Encoding utf8
          python project-chromatic-overlord/tools/platform_validation.py --require-windows --engine "$exe" --out "$env:PROTOCOL_OUT/platform" *> "$env:PROTOCOL_OUT/protocol.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native artifact protocol check failed' }
          python project-chromatic-overlord/research/bench_protocol.py --require-windows --engine "$exe" --out "$env:PROTOCOL_OUT/research-protocol.json" *> "$env:PROTOCOL_OUT/research-protocol.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native research protocol check failed' }
      - name: Native MSVC AddressSanitizer regression build
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -products '*' -property installationPath
          $toolset=Get-ChildItem "$vs/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $env:PATH="$($toolset.FullName)/bin/Hostx64/x64;$env:PATH"
          cmake -S project-chromatic-overlord -B build-windows-factorial-asan -G 'Visual Studio 17 2022' -A x64 -DCHROMATIC_ASAN=ON *> "$env:PROTOCOL_OUT/asan-configure.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC ASAN configure failed' }
          cmake --build build-windows-factorial-asan --config Release --parallel 2 *> "$env:PROTOCOL_OUT/asan-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC ASAN build failed' }
          ctest --test-dir build-windows-factorial-asan -C Release --output-on-failure *> "$env:PROTOCOL_OUT/asan-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC ASAN regression failed' }
          $asanHash=(Get-FileHash build-windows-factorial-asan/Release/chromatic_overlord.exe -Algorithm SHA256).Hash.ToLower()
          @{ctest_exit=0;engine_sha256=$asanHash;source_commit='${{ github.sha }}';kind='native MSVC AddressSanitizer Release, separate safety build'} | ConvertTo-Json | Set-Content "$env:PROTOCOL_OUT/asan.json" -Encoding utf8
      - name: Preserve artifact validation
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          git config user.name 'chromatic-validation[bot]'
          git config user.email 'chromatic-validation[bot]@users.noreply.github.com'
          git add -- "$env:PROTOCOL_OUT"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage artifact validation' }
          git commit -m '[factorial] Preserve exact Windows artifact protocol validation [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit artifact validation' }
          git fetch origin operation-overlord
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch research branch' }
          git rebase FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Result rebase requires review; artifact retained' }
          git push origin HEAD:operation-overlord
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push artifact validation' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: factorial-artifact-validation-${{ github.run_id }}
          path: ${{ env.PROTOCOL_OUT }}
