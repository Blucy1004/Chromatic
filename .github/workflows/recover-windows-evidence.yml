name: Recover original Windows evidence
on:
  workflow_dispatch:
  push:
    branches: [operation-overlord]
    paths: [.github/workflows/recover-windows-evidence.yml]
permissions:
  actions: read
  contents: write
  checks: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overlord-windows-40146054219-1
          run-id: 40146054219
          github-token: ${{ github.token }}
          path: recovered-windows
      - name: Verify and preserve the original Windows artifact through Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          def api(path,data=None,method=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=json.dumps(data).encode() if data is not None else None,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'chromatic-evidence-recovery'})
              with urllib.request.urlopen(request) as response:return json.load(response)
          import traceback
          def publish(name,data,conclusion='neutral'):
              text=json.dumps(data,indent=2)
              if len(text)>63000:text=text[:63000]
              result=api('check-runs',{'name':name,'head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':conclusion,'output':{'title':name,'summary':'Original Windows run 40146054219 artifact audit','text':'```json\n'+text+'\n```'}})
              print('Evidence check',result['id'])
          try:
              root=Path('recovered-windows');summaries=list(root.rglob('run-summary.json'))
              assert len(summaries)==1
              summary_path=summaries[0];directory=summary_path.parent;summary=json.loads(summary_path.read_text())
              protocol_path=directory/'platform/protocol.json';matrix_path=directory/'matrix/summary.json'
              publish('Original Windows artifact facts',{'summary':summary,'protocol':json.loads(protocol_path.read_text()) if protocol_path.exists() else None,'matrix':json.loads(matrix_path.read_text()) if matrix_path.exists() else None,'files':[str(p) for p in root.rglob('*') if p.is_file()]})
              assert summary['passed'] and summary['native_windows']
              protocol=json.loads((directory/'platform/protocol.json').read_text())
              metadata=json.loads((directory/'matrix/metadata.json').read_text())
              assert protocol['os']=='Windows' and metadata['os']=='Windows'
              assert 'MSVC' in summary['build']['compiler_record']
              executables=list(root.rglob('chromatic_overlord.exe'));assert len(executables)==1
              binary=executables[0].read_bytes();assert hashlib.sha256(binary).hexdigest()==protocol['engine_sha256']==metadata['engine_sha256']
              offset=int.from_bytes(binary[60:64],'little');assert binary[offset:offset+4]==b'PE\0\0' and int.from_bytes(binary[offset+4:offset+6],'little')==0x8664
              entries=[]
              for path in directory.rglob('*'):
                  if path.is_file():
                      blob=api('git/blobs',{'encoding':'base64','content':base64.b64encode(path.read_bytes()).decode()})
                      entries.append({'path':'project-chromatic-overlord/reports/windows-native/40146054219-1/'+path.relative_to(directory).as_posix(),'mode':'100644','type':'blob','sha':blob['sha']})
              documents=list(root.rglob('WINDOWS_VALIDATION.md'));assert len(documents)==1
              blob=api('git/blobs',{'encoding':'base64','content':base64.b64encode(documents[0].read_bytes()).decode()})
              entries.append({'path':'project-chromatic-overlord/WINDOWS_VALIDATION.md','mode':'100644','type':'blob','sha':blob['sha']})
              head=api('git/ref/heads/operation-overlord')['object']['sha'];base=api('git/commits/'+head)['tree']['sha']
              tree=api('git/trees',{'base_tree':base,'tree':entries})['sha']
              commit=api('git/commits',{'message':'Preserve verified original Windows native evidence [skip ci]','tree':tree,'parents':[head]})['sha']
              api('git/refs/heads/operation-overlord',{'sha':commit,'force':False},method='PATCH')
              print('Original Windows evidence preserved:',commit)
          except Exception:
              publish('Windows artifact recovery error',{'traceback':traceback.format_exc(),'files':[str(p) for p in Path('recovered-windows').rglob('*') if p.is_file()]},'failure')
              raise
          PY
