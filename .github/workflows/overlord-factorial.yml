name: Factorial native Windows research
on:
  workflow_dispatch:
  push:
    branches: [operation-overlord]
    paths: [.github/workflows/overlord-factorial.yml]
permissions:
  contents: write
concurrency:
  group: factorial-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RESEARCH_BUILD: build-windows-factorial
      RESEARCH_OUT: project-chromatic-overlord/reports/factorial/windows/${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install python-chess==1.999 chess==1.10.0 psutil==7.2.2
      - name: Native MSVC Release and regression checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RESEARCH_OUT | Out-Null
          cmake -S project-chromatic-overlord -B "$env:RESEARCH_BUILD" -G 'Visual Studio 17 2022' -A x64 *> "$env:RESEARCH_OUT/configure.log"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build "$env:RESEARCH_BUILD" --config Release --parallel 2 *> "$env:RESEARCH_OUT/build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          ctest --test-dir "$env:RESEARCH_BUILD" -C Release --output-on-failure *> "$env:RESEARCH_OUT/ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native regression failed' }
          $compiler=Get-ChildItem "$env:RESEARCH_BUILD/CMakeFiles" -Recurse -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          Get-Content $compiler.FullName | Set-Content "$env:RESEARCH_OUT/compiler.txt" -Encoding utf8
      - name: Bounded native factorial pipeline
        shell: pwsh
        run: |
          python project-chromatic-overlord/research/run.py --require-windows --engine "$env:RESEARCH_BUILD/Release/chromatic_overlord.exe" --out "$env:RESEARCH_OUT" --stage pipeline --max-seconds 5400 *> "$env:RESEARCH_OUT/pipeline.log"
          if ($LASTEXITCODE -ne 0) { throw 'Research paused or failed; retain all checkpoints' }
      - name: Preserve native evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          git config user.name 'chromatic-validation[bot]'
          git config user.email 'chromatic-validation[bot]@users.noreply.github.com'
          git add -- "$env:RESEARCH_OUT"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage research evidence' }
          git commit -m '[factorial] Preserve native Windows research [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit research evidence' }
          git fetch origin operation-overlord
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch latest research branch' }
          git rebase FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Result rebase requires review; artifact retained' }
          git push origin HEAD:operation-overlord
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push research evidence' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: factorial-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESEARCH_OUT }}
            ${{ env.RESEARCH_BUILD }}/Release/*.exe
